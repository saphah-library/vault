<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Console 0 - Access Gate</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    background-color: #0a0a0a;
    color: #c0c0c0;
    font-family: Consolas, monospace;
}

/* center screen */
.container {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* box */
.box {
    text-align: left;
    max-width: 600px;
    padding: 20px;
    border: 1px solid #333;
    background-color: #111;
}

/* title */
.title {
    color: #ffffff;
    font-size: 18px;
    margin-bottom: 10px;
}

/* status */
.status {
    color: #888;
    margin-bottom: 15px;
}

/* message */
.msg {
    line-height: 1.6;
    color: #c0c0c0;
}

/* blinking cursor effect */
.cursor {
    display: inline-block;
    width: 10px;
    background: #c0c0c0;
    animation: blink 1s infinite;
    margin-left: 5px;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* footer line */
.footer {
    margin-top: 15px;
    color: #555;
    font-size: 12px;
}
</style>

</head>

<body>

<div class="container">
    <div class="box">

        <div class="title">SAPHAH ACCESS CONSOLE</div>

        <div class="status">STATUS: UNDER CONSTRUCTION</div>

        <div class="msg">
            Initialising access layer...<br>
            Checking authentication modules...<br>
            Loading user registry (access.json)...<br><br>

            This system is currently being configured.<br>
            Library and Vault access will be enabled soon.<br><br>

            Please return later.<span class="cursor"></span>
        </div>

        <div class="footer">
            console0 / entry gateway / v0.1
        </div>

    </div>
</div>

</body>
</html>
